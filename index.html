<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Luyện nói tiếng Anh với Trường Đẹp Trai – Audio theo chủ đề</title>
  <style>
    :root {
      --bg: #f6f4fb;
      --card: #ffffff;
      --ink: #1f1b3a;
      --mute: #6a6585;
      --accent: #5b45d6;
      --accent-ink: #ffffff;
      --accent2: #ece8ff;
      --warm: #f59e0b;
      --line: #e1dcf2;
      --ok: #17803d;
      --okbg: #ddf4e4;
      --bad: #b42318;
      --badbg: #fde4e1;
      --shadow: 0 1px 2px rgba(31, 27, 58, .06), 0 6px 18px rgba(31, 27, 58, .06);
      --r: 14px
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #12101f;
        --card: #1c1932;
        --ink: #eceaf9;
        --mute: #a19cc0;
        --accent: #a597ff;
        --accent-ink: #14112a;
        --accent2: #2a2552;
        --warm: #fbbf24;
        --line: #2f2a54;
        --ok: #7fdc9b;
        --okbg: #17331f;
        --bad: #ff9d94;
        --badbg: #3f1f1c;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25)
      }
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding-top: env(safe-area-inset-top, 0px);
      -webkit-text-size-adjust: 100%
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 16px 130px
    }

    /* ---------- Header ---------- */
    .hero {
      background: linear-gradient(135deg, var(--accent), #7c5cf0 60%, #b06af0);
      color: #fff;
      border-radius: 20px;
      padding: 20px 20px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 14px
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) .hero {
        background: linear-gradient(135deg, #3b2f8f, #5a3fb8 60%, #7a3fa8)
      }
    }

    .hero h1 {
      font-size: 22px;
      line-height: 1.25;
      margin: 0 0 4px
    }

    .hero p {
      margin: 0;
      font-size: 14px;
      opacity: .92
    }

    /* ---------- Settings ---------- */
    details.settings {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      margin-bottom: 14px;
      font-size: 14px
    }

    details.settings summary {
      cursor: pointer;
      padding: 12px 14px;
      font-weight: 600;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    details.settings summary::-webkit-details-marker {
      display: none
    }

    details.settings summary::after {
      content: "▾";
      color: var(--mute);
      transition: transform .2s
    }

    details.settings[open] summary::after {
      transform: rotate(180deg)
    }

    .set-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 14px 14px
    }

    .set-grid label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--mute);
      font-size: 13px
    }

    .set-grid label:first-child {
      grid-column: 1 / -1
    }

    select {
      font: inherit;
      font-size: 15px;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      min-height: 44px;
      width: 100%
    }

    /* ---------- Tabs ---------- */
    .tabwrap {
      position: sticky;
      top: 0;
      z-index: 5;
      margin: 0 -16px 12px;
      padding: 8px 16px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px)
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px
    }

    .tabs::-webkit-scrollbar {
      display: none
    }

    .tab {
      flex: none;
      white-space: nowrap;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 16px;
      min-height: 40px;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s
    }

    .tab[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent)
    }

    /* ---------- Summary row ---------- */
    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 0 0 10px;
      font-size: 14px;
      color: var(--mute)
    }

    .summary b {
      color: var(--ink)
    }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      color: var(--ink);
      font-weight: 500
    }

    .switch input {
      appearance: none;
      -webkit-appearance: none;
      width: 42px;
      height: 24px;
      border-radius: 999px;
      background: var(--line);
      position: relative;
      cursor: pointer;
      margin: 0;
      transition: background .2s
    }

    .switch input::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
      transition: transform .2s
    }

    .switch input:checked {
      background: var(--accent)
    }

    .switch input:checked::after {
      transform: translateX(18px)
    }

    /* ---------- Status pill ---------- */
    #status {
      position: sticky;
      top: 58px;
      z-index: 4;
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--accent2);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 12px;
      font-size: 14px;
      word-break: break-word
    }

    #status.show {
      display: flex
    }

    #status .dot {
      flex: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent)
    }

    #status.live .dot {
      background: #e5484d;
      animation: pulse 1.1s ease-in-out infinite
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(229, 72, 77, .55)
      }

      50% {
        box-shadow: 0 0 0 8px rgba(229, 72, 77, 0)
      }
    }

    /* ---------- Cards ---------- */
    .q {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      scroll-margin-top: 120px;
      scroll-margin-bottom: 130px;
      transition: border-color .2s, box-shadow .2s
    }

    .q.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent2), var(--shadow)
    }

    .qhead {
      display: flex;
      gap: 12px;
      align-items: flex-start
    }

    .num {
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent2);
      color: var(--accent);
      font-weight: 700;
      font-size: 14px;
      display: grid;
      place-items: center;
      margin-top: 1px
    }

    .q h3 {
      flex: 1;
      margin: 0;
      font-size: 18px;
      line-height: 1.4;
      font-weight: 650
    }

    .badge {
      flex: none;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent2);
      color: var(--accent)
    }

    .badge.good {
      background: var(--okbg);
      color: var(--ok)
    }

    .badge.low {
      background: var(--badbg);
      color: var(--bad)
    }

    .badge:empty {
      display: none
    }

    .a {
      margin: 12px 0 14px 42px;
      padding: 10px 12px;
      border-left: 3px solid var(--warm);
      background: var(--bg);
      border-radius: 0 10px 10px 0;
      font-size: 16px;
      transition: filter .2s
    }

    .q.hide .a {
      filter: blur(7px);
      user-select: none
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: 42px
    }

    button {
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 13px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background .15s, transform .05s
    }

    button:hover {
      background: var(--accent2)
    }

    button:active {
      transform: scale(.97)
    }

    button.primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      font-weight: 650
    }

    button.primary:hover {
      filter: brightness(1.08);
      background: var(--accent)
    }

    button:focus-visible,
    select:focus-visible,
    summary:focus-visible,
    .switch input:focus-visible {
      outline: 3px solid var(--warm);
      outline-offset: 2px
    }

    /* ---------- Feedback ---------- */
    .fb {
      margin: 14px 0 0 42px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--line);
      font-size: 14px
    }

    .fb .score {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 4px
    }

    .fb .heard {
      color: var(--mute);
      margin-bottom: 8px;
      word-break: break-word
    }

    .fb .words span {
      display: inline-block;
      margin: 2px 4px 2px 0;
      padding: 1px 8px;
      border-radius: 7px
    }

    .fb .words .ok {
      background: var(--okbg);
      color: var(--ok)
    }

    .fb .words .miss {
      background: var(--badbg);
      color: var(--bad);
      text-decoration: underline wavy;
      text-underline-offset: 3px
    }

    .fb.good {
      border-left: 4px solid var(--ok)
    }

    .fb.mid {
      border-left: 4px solid var(--warm)
    }

    .fb.low {
      border-left: 4px solid var(--bad)
    }

    /* ---------- Bottom dock ---------- */
    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px))
    }

    .dock-in {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      gap: 8px
    }

    .dock button {
      flex: 1;
      min-height: 48px;
      font-weight: 600
    }

    .dock #stop {
      flex: 0 0 auto;
      padding-inline: 16px
    }

    .dock #doneSpeak {
      display: none;
      background: var(--ok);
      border-color: var(--ok);
      color: var(--card)
    }

    .dock.listening #doneSpeak {
      display: inline-flex
    }

    .dock.listening #playTopic,
    .dock.listening #practice {
      display: none
    }

    .lbl-short {
      display: none
    }

    @media (max-width:520px) {
      .lbl-long {
        display: none
      }

      .lbl-short {
        display: inline
      }

      .hero h1 {
        font-size: 20px
      }

      .q h3 {
        font-size: 17px
      }

      .a,
      .actions,
      .fb {
        margin-left: 0
      }

      .actions button.primary {
        flex: 1 1 100%
      }

      .actions button:not(.primary) {
        flex: 1 1 calc(50% - 4px)
      }
    }

    @media (prefers-reduced-motion:reduce) {

      html {
        scroll-behavior: auto
      }

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="hero">
      <p>Nghe câu hỏi, tự trả lời, rồi nghe đáp án mẫu. Ở chế độ luyện tập, app sẽ chấm xem bạn nói có đúng đáp án không.</p>
    </header>

    <details class="settings">
      <summary>⚙ Giọng đọc &amp; tốc độ</summary>
      <div class="set-grid">
        <label>Giọng đọc <select id="voice"></select></label>
        <label>Tốc độ <select id="rate">
            <option value="0.7">Chậm</option>
            <option value="0.85" selected>Vừa</option>
            <option value="1">Bình thường</option>
            <option value="1.25">Nhanh</option>
            <option value="1.5">Siêu Nhanh</option>
          </select></label>
      </div>
    </details>

    <div class="tabwrap">
      <div class="tabs" id="tabs" role="group" aria-label="Chủ đề"></div>
    </div>

    <div class="summary">
      <span id="summary"></span>
      <label class="switch"><input type="checkbox" id="hideAns"> Ẩn đáp án</label>
    </div>

    <div id="status" aria-live="polite"><span class="dot"></span><span id="statusText"></span></div>
    <div id="list"></div>
  </main>

  <nav class="dock" id="dock" aria-label="Điều khiển">
    <div class="dock-in">
      <button class="primary" id="playTopic">▶ <span class="lbl-long">Nghe cả chủ đề</span><span class="lbl-short">Nghe cả chủ đề</span></button>
      <button class="primary" id="practice">🎤 <span>Luyện tập</span></button>
      <button id="doneSpeak">✔ Trả lời xong</button>
      <button id="stop" aria-label="Dừng">■ Dừng</button>
    </div>
  </nav>

  <script>
    const T = [
      {
        n: "Work – Công việc", q: [
          ["Have you ever worked part time?", "Yes, I have. I worked part-time as a waiter at a restaurant."],
          ["What kind of job do you want to do in the future?", "I want to be a software developer because I like technology."],
          ["What have you been doing to prepare for your future job?", "I have been learning programming languages, improving my English."],
          ["What do you do to get ready for a job interview?", "I usually research the company, prepare answers to common questions, and wear formal clothes."]]
      },
      {
        n: "Technology – Công nghệ", q: [
          ["What invention do you think is useful for your study?", "I think the computer is very useful because I can study and find information."],
          ["What do you usually do on the Internet?", "I usually use the Internet to study, search for information, and watch videos."],
          ["Do you prefer using a mobile phone or a laptop to study online?", "I prefer using a laptop because it has a bigger screen and is easier to use."],
          ["Do you know any famous inventor?", "Yes, I do. I know Thomas Edison. He invented the light bulb."]]
      },
      {
        n: "Holidays – Kỳ nghỉ", q: [
          ["What activities do you like to do when you are on holiday?", "I like travelling, taking photos and eating local food."],
          ["What kind of accommodation do you like to stay in when you are on holiday?", "I like staying in hotels because they are comfortable and convenient."],
          ["Have you ever had any problems on holiday?", "Yes, I have. I once lost my phone during a trip."],
          ["Do you prefer travelling in a group or on your own?", "I prefer travelling in a group because I can have fun with my friends."]]
      },
      {
        n: "Products – Sản phẩm", q: [
          ["What is the last thing you bought online?", "I bought a T-shirt online last week. It was cheap and beautiful."],
          ["How important do you think logos are?", "I think logos are important because they help people remember a brand."],
          ["Which websites do you visit when you want to buy things such as clothes, shoes, and books?", "I usually visit Shopee because it has many products and good prices."],
          ["What do you think makes one website better than another?", "I think a good website should be easy to use, beautiful and fast."]]
      },
      {
        n: "History – Lịch sử", q: [
          ["Do you often play video games with your friends?", "Yes, I do. I often play video games with my friends at weekends."],
          ["What sorts of game are popular in your country?", "Mobile games and online games are very popular in Vietnam."],
          ["Do you think that video games are bad for you?", "Not always. They can help us relax, but playing too much is bad."],
          ["What historical place in Vietnam have you ever visited?", "I have visited the Independence Palace in Ho Chi Minh City. It was very interesting."]]
      },
      {
        n: "Nature – Thiên nhiên", q: [
          ["If you could live in another country, where would you move to?", "I would like to live in Japan because it is beautiful and safe."],
          ["If you won a lot of money, would you stop working or studying?", "No, I wouldn't. I would continue studying because education is important."],
          ["What is your favorite animal?", "My favorite animal is the dog because it is friendly and cute."],
          ["Have you ever visited a zoo?", "Yes, I have. I visited a zoo with my family. It was fun."]]
      }
    ];

    const synth = window.speechSynthesis;
    let cur = 0, token = 0, voices = [];
    const results = {}; /* "chủ đề-câu" -> {said, pct} */
    const $ = id => document.getElementById(id);
    const store = {
      get(k) { try { return localStorage.getItem(k) } catch (e) { return null } },
      set(k, v) { try { localStorage.setItem(k, v) } catch (e) { } }
    };

    function setStatus(msg, live) {
      const s = $("status");
      $("statusText").textContent = msg || "";
      s.classList.toggle("show", !!msg);
      s.classList.toggle("live", !!live);
    }
    function setListening(on) { $("dock").classList.toggle("listening", on) }

    /* ===== Giọng đọc ===== */
    function loadVoices() {
      voices = synth.getVoices().filter(v => /^en/i.test(v.lang));
      const s = $("voice"); s.innerHTML = "";
      voices.forEach((v, i) => { const o = document.createElement("option"); o.value = i; o.textContent = v.name + " (" + v.lang + ")"; s.appendChild(o) });
      const saved = store.get("sp-voice");
      let idx = voices.findIndex(v => v.name === saved);
      if (idx < 0) idx = voices.findIndex(v => /en-US|en-GB/.test(v.lang));
      if (idx >= 0) s.value = idx;
    }
    if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices } else setStatus("Trình duyệt này không hỗ trợ đọc giọng nói.");
    $("voice").onchange = () => { const v = voices[$("voice").value]; if (v) store.set("sp-voice", v.name) };
    { const r = store.get("sp-rate"); if (r) $("rate").value = r; $("rate").onchange = () => store.set("sp-rate", $("rate").value) }

    function say(text) { return new Promise(res => { const u = new SpeechSynthesisUtterance(text); const v = voices[$("voice").value]; if (v) { u.voice = v; u.lang = v.lang } else u.lang = "en-US"; u.rate = +$("rate").value; u.onend = res; u.onerror = res; synth.speak(u) }) }
    const wait = ms => new Promise(r => setTimeout(r, ms));

    /* ===== Nhận diện giọng nói & chấm đáp án ===== */
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null, stopListen = null, micDenied = false;

    function norm(s) {
      return s.toLowerCase().replace(/[’‘`]/g, "'")
        .replace(/can't/g, "can not").replace(/won't/g, "will not")
        .replace(/n't/g, " not").replace(/'m/g, " am").replace(/'re/g, " are")
        .replace(/'ve/g, " have").replace(/'ll/g, " will").replace(/'d/g, " would").replace(/'s/g, " is")
        .replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(Boolean);
    }
    function lev(a, b) {
      const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
      for (let j = 1; j <= n; j++) d[0][j] = j;
      for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      return d[m][n];
    }
    const same = (x, y) => x === y || (x.length >= 5 && y.length >= 5 && lev(x, y) <= 1);

    /* So khớp theo thứ tự (LCS) giữa đáp án và lời bạn nói */
    function compare(answer, said) {
      const A = norm(answer), B = norm(said), m = A.length, n = B.length;
      const L = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
        L[i][j] = same(A[i - 1], B[j - 1]) ? L[i - 1][j - 1] + 1 : Math.max(L[i - 1][j], L[i][j - 1]);
      const hit = new Array(m).fill(false);
      let i = m, j = n;
      while (i > 0 && j > 0) {
        if (same(A[i - 1], B[j - 1]) && L[i][j] === L[i - 1][j - 1] + 1) { hit[i - 1] = true; i--; j--; }
        else if (L[i - 1][j] >= L[i][j - 1]) i--; else j--;
      }
      return { words: A, hit, pct: m ? Math.round(L[m][n] / m * 100) : 0 };
    }

    const keyOf = i => cur + "-" + i;

    function paintFeedback(i) {
      const card = document.querySelectorAll(".q")[i]; if (!card) return;
      const old = card.querySelector(".fb"); if (old) old.remove();
      const badge = card.querySelector(".badge");
      const res = results[keyOf(i)];
      if (!res) { badge.textContent = ""; return }
      const said = res.said;
      const fb = document.createElement("div");
      const sc = document.createElement("div"); sc.className = "score";
      if (!said.trim()) {
        fb.className = "fb low"; sc.textContent = "❌ Không nghe thấy giọng nói – thử lại nhé";
        fb.append(sc);
        badge.textContent = "0%"; badge.className = "badge low";
      } else {
        const r = compare(T[cur].q[i][1], said);
        const hd = document.createElement("div"); hd.className = "heard";
        const wd = document.createElement("div"); wd.className = "words";
        fb.className = "fb " + (r.pct >= 80 ? "good" : r.pct >= 50 ? "mid" : "low");
        sc.textContent = (r.pct >= 80 ? "✅ Đúng rồi! " : r.pct >= 50 ? "👍 Gần đúng. " : "❌ Chưa đúng. ") + "Khớp " + r.pct + "% đáp án mẫu";
        hd.textContent = "Bạn nói: “" + said.trim() + "”";
        r.words.forEach((w, k) => { const s = document.createElement("span"); s.className = r.hit[k] ? "ok" : "miss"; s.textContent = w; wd.appendChild(s) });
        fb.append(sc, hd, wd);
        badge.textContent = r.pct + "%"; badge.className = "badge" + (r.pct >= 80 ? " good" : r.pct < 50 ? " low" : "");
      }
      card.appendChild(fb);
    }

    function showFeedback(i, said) {
      const pct = said.trim() ? compare(T[cur].q[i][1], said).pct : 0;
      results[keyOf(i)] = { said, pct };
      paintFeedback(i); updateSummary();
    }

    function updateSummary() {
      const n = T[cur].q.length;
      const done = T[cur].q.map((_, i) => results[keyOf(i)]).filter(Boolean);
      const el = $("summary");
      if (!done.length) { el.innerHTML = "<b>" + n + " câu hỏi</b> · chưa luyện nói"; return }
      const avg = Math.round(done.reduce((s, r) => s + r.pct, 0) / done.length);
      el.innerHTML = "Đã luyện <b>" + done.length + "/" + n + "</b> câu · điểm trung bình <b>" + avg + "%</b>";
    }

    /* Nghe: trả về chuỗi bạn nói, "" nếu không có tiếng, null nếu không dùng được micro */
    function listen(t) {
      return new Promise(resolve => {
        if (!SR || micDenied) { resolve(null); return }
        const r = new SR(); rec = r;
        r.lang = "en-US"; r.continuous = true; r.interimResults = true;
        let finalText = "", interim = "", done = false, silence = null, first = null;
        const live = () => setStatus("Đang nghe: " + ((finalText + " " + interim).trim() || "…"), true);
        const finish = (val) => {
          if (done) return; done = true;
          clearTimeout(silence); clearTimeout(first);
          setListening(false); stopListen = null; rec = null;
          resolve(val !== undefined ? val : (finalText + " " + interim).trim());
        };
        const halt = () => { try { r.stop() } catch (e) { finish() } };
        stopListen = halt;
        r.onresult = e => {
          interim = "";
          for (let k = e.resultIndex; k < e.results.length; k++) {
            const x = e.results[k];
            if (x.isFinal) finalText += (finalText ? " " : "") + x[0].transcript; else interim += x[0].transcript;
          }
          clearTimeout(first); clearTimeout(silence);
          silence = setTimeout(halt, 2500); /* im lặng 2,5s thì tự kết thúc */
          live();
        };
        r.onerror = e => {
          if (e.error === "not-allowed" || e.error === "service-not-allowed") { micDenied = true; finish(null); setStatus("Chưa được cấp quyền micro – hãy cho phép micro cho trang này rồi thử lại.") }
          else if (e.error === "no-speech" || e.error === "aborted") finish();
          else if (e.error === "network") { finish(null); setStatus("Lỗi mạng khi nhận diện giọng nói (cần Internet).") }
        };
        r.onend = () => finish();
        first = setTimeout(halt, 12000); /* 12s không nói gì thì bỏ qua */
        setListening(true);
        setStatus("Đang nghe… hãy trả lời", true);
        try { r.start() } catch (e) { finish(null) }
      });
    }

    /* ===== Điều khiển phát ===== */
    function stop() {
      token++; synth.cancel();
      if (rec) { try { rec.abort() } catch (e) { } }
      setListening(false); setStatus("");
      document.querySelectorAll(".q").forEach(e => e.classList.remove("active"));
    }
    function mark(i) {
      document.querySelectorAll(".q").forEach((e, j) => e.classList.toggle("active", i === j));
      const e = document.querySelectorAll(".q")[i]; if (e) e.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    function reveal(i) { document.querySelectorAll(".q")[i].classList.remove("hide") }

    async function one(i, mode, t) {
      const [q, a] = T[cur].q[i], total = T[cur].q.length; mark(i);
      const tag = "Câu " + (i + 1) + "/" + total + " · ";
      if (mode !== "a") { setStatus(tag + "Cô đang hỏi…"); await say(q); if (t !== token) return }
      if (mode === "practice") {
        setStatus(tag + "Đến lượt bạn trả lời…");
        const said = await listen(t); if (t !== token) return;
        if (said === null) { await wait(9000); if (t !== token) return; reveal(i) }
        else { reveal(i); showFeedback(i, said); setStatus(tag + "Đã chấm xong"); await wait(1200); if (t !== token) return }
      }
      if (mode !== "q") { setStatus(tag + "Đáp án mẫu…"); if (mode !== "a") await wait(500); await say(a) }
    }
    async function run(mode) {
      stop(); const t = token;
      for (let i = 0; i < T[cur].q.length; i++) { await one(i, mode, t); if (t !== token) return; await wait(900) }
      if (t === token) { setStatus("🎉 Xong chủ đề này!"); mark(-1); setTimeout(() => { if (t === token) setStatus("") }, 3500) }
    }

    /* ===== Giao diện ===== */
    function render() {
      const l = $("list"); l.innerHTML = "";
      T[cur].q.forEach(([q, a], i) => {
        const d = document.createElement("article");
        d.className = "q" + ($("hideAns").checked ? " hide" : "");
        d.innerHTML =
          '<div class="qhead"><span class="num"></span><h3></h3><span class="badge"></span></div>' +
          '<p class="a"></p>' +
          '<div class="actions">' +
          '<button class="primary">🎤 Thử nói</button>' +
          '<button>🔊 Câu hỏi</button><button>🔊 Đáp án</button><button>▶ Cả hai</button><button>👁 Hiện/ẩn</button>' +
          '</div>';
        d.querySelector(".num").textContent = i + 1;
        d.querySelector("h3").textContent = q;
        d.querySelector(".a").textContent = a;
        const b = d.querySelectorAll("button");
        b[0].onclick = async () => {
          stop(); const t = token; mark(i);
          const said = await listen(t); if (t !== token) return;
          if (said === null) { if (!micDenied) setStatus("Trình duyệt này không hỗ trợ nhận diện giọng nói. Hãy dùng Chrome, Edge hoặc Safari."); return }
          reveal(i); showFeedback(i, said); setStatus("Đã chấm xong"); mark(-1); setTimeout(() => { if (t === token) setStatus("") }, 2500);
        };
        b[1].onclick = () => { stop(); const t = token; one(i, "q", t) };
        b[2].onclick = () => { stop(); const t = token; one(i, "a", t) };
        b[3].onclick = () => { stop(); const t = token; one(i, "qa", t) };
        b[4].onclick = () => d.classList.toggle("hide");
        l.appendChild(d);
        paintFeedback(i);
      });
      updateSummary();
    }
    function tabs() {
      const t = $("tabs"); t.innerHTML = "";
      T.forEach((x, i) => {
        const b = document.createElement("button");
        b.className = "tab"; b.textContent = x.n; b.setAttribute("aria-pressed", i === cur);
        b.onclick = () => { stop(); cur = i; tabs(); render(); store.set("sp-topic", i) };
        t.appendChild(b);
      });
      const on = t.querySelector('[aria-pressed="true"]'); if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
    }

    $("playTopic").onclick = () => run("qa");
    $("practice").onclick = () => run("practice");
    $("stop").onclick = stop;
    $("doneSpeak").onclick = () => { if (stopListen) stopListen() };
    $("hideAns").onchange = () => {
      store.set("sp-hide", $("hideAns").checked ? "1" : "0");
      document.querySelectorAll(".q").forEach(e => e.classList.toggle("hide", $("hideAns").checked));
    };

    $("hideAns").checked = store.get("sp-hide") === "1";
    { const s = parseInt(store.get("sp-topic"), 10); if (s >= 0 && s < T.length) cur = s }
    tabs(); render();
    if (!SR) setStatus("Trình duyệt này không hỗ trợ chấm phát âm (nên dùng Chrome/Edge/Safari). Các chức năng nghe vẫn dùng bình thường.");
  </script>
</body>

</html>
