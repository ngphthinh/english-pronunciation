<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Audio theo chủ đề</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <main>
    <header class="hero">
      <p>Nghe câu hỏi, tự trả lời, rồi nghe đáp án mẫu. Ở chế độ luyện tập, app sẽ chấm xem bạn nói có đúng đáp án
        không.</p>
    </header>

    <details class="settings">
      <summary>⚙ Giọng đọc &amp; tốc độ</summary>
      <div class="set-grid">
        <label>Giọng đọc <select id="voice"></select></label>
        <label>Tốc độ <select id="rate">
            <option value="0.7">Chậm</option>
            <option value="0.85" selected>Vừa</option>
            <option value="1">Bình thường</option>
            <option value="1.25">Nhanh</option>
            <option value="1.5">Siêu Nhanh</option>
          </select></label>
      </div>
    </details>

    <div class="tabwrap">
      <div class="tabs" id="tabs" role="group" aria-label="Chủ đề"></div>
    </div>

    <div class="summary">
      <span id="summary"></span>
      <label class="switch"><input type="checkbox" id="hideAns"> Ẩn đáp án</label>
    </div>

    <div id="status" aria-live="polite"><span class="dot"></span><span id="statusText"></span></div>
    <div id="list"></div>
  </main>

  <nav class="dock" id="dock" aria-label="Điều khiển">
    <div class="dock-in">
      <button class="primary" id="playTopic">▶ <span class="lbl-long">Nghe cả chủ đề</span><span class="lbl-short">Nghe
          cả chủ đề</span></button>
      <button class="primary" id="practice">🎤 <span>Luyện tập</span></button>
      <button id="doneSpeak">✔ Trả lời xong</button>
      <button id="stop" aria-label="Dừng">■ Dừng</button>
    </div>
  </nav>

  <script src="/script.js"></script>
</body>

</html>
